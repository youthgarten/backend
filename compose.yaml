services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: youthgarten
      MYSQL_USER: youthgarten
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 25

  migrate:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://youthgarten:${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}@database:3306/youthgarten
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy

  backend:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://youthgarten:${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}@database:3306/youthgarten
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SECURE_COOKIES: ${SECURE_COOKIES:-1}
      AI_PROVIDER: chat_completions
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 5

volumes:
  mysql-data:
