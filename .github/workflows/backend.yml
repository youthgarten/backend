name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: youthgarten_test
          MYSQL_USER: youthgarten
          MYSQL_PASSWORD: ci-db-password
        ports:
          - 3318:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 25
    env:
      DATABASE_URL: mysql+pymysql://youthgarten:ci-db-password@127.0.0.1:3318/youthgarten_test
      TEST_DATABASE_URL: mysql+pymysql://youthgarten:ci-db-password@127.0.0.1:3318/youthgarten_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.12
          uv sync --locked
      - name: Verify MySQL migrations and schema
        run: |
          uv run --locked python -m alembic upgrade 0003
          uv run --locked python -m alembic upgrade head
          uv run --locked python -m alembic check
      - name: Test API and Phaser protocol
        run: uv run --locked python -m pytest -q
